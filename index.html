
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Alert</title>

 <link rel="stylesheet" href="style.css"></head>

<body>

    <h1>Toast Alert</h1>

    <button onclick="showToast('success')">Success</button>

    <button onclick="showToast('error')">Error</button>

    <button onclick="showToast('warning')">Warning</button>

    <div id="toast"></div>

    <script>
        let timer;

        function showToast(type) {

            let toast = document.getElementById("toast");

            if (type === "success") {
                toast.innerText = "Success! Your action completed.";
            }
            else if (type === "error") {
                toast.innerText = "Error! Something went wrong.";
            }
            else if (type === "warning") {
                toast.innerText = "Warning! Please be careful.";
            }

            toast.className = "";
            toast.classList.add("show", type);

            clearTimeout(timer);

            timer = setTimeout(function() {
                toast.className = "";
            }, 1000);
        }
    </script>

</body>
</html>
